name: Verificar build (pull request)

# Roda em pull requests e NÃO publica nada. O deploy continua só no push para main.
on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Conferir que as duas páginas foram geradas
        run: |
          test -f dist/index.html
          test -f dist/diagnostico360/index.html
